:root{
  --navy:#1B237A; --rosa:#F0C4BE; --koralle:#D9606F; --graublau:#E4ECF1; --sand:#FAF8F5; --weiss:#FFFFFF;
  --title:"Josefin Sans","Century Gothic",Futura,Arial,sans-serif;
  --text:"Open Sans",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--weiss);color:var(--navy);font-family:var(--text);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 48px}

/* Kopfzeile */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.kurs{font-family:var(--title);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:6px 18px;font-weight:700;font-size:13px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.rosa{background:var(--rosa);color:var(--navy)}
.pill.koralle{background:var(--koralle);color:var(--weiss)}
.bar{height:6px;background:var(--graublau);border-radius:999px;overflow:hidden;margin-bottom:28px}
.bar i{display:block;height:100%;width:0;background:var(--koralle);border-radius:999px;transition:width .35s ease}

h1,h2{font-family:var(--title);font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}

/* Start */
.hero{display:grid;grid-template-columns:1fr;position:relative;margin-bottom:28px}
.hero .r{background:var(--rosa);padding:28px 28px 72px;width:78%}
.hero .r small{display:block;font-weight:700;font-size:15px}
.hero .r strong{font-family:var(--title);font-size:clamp(22px,4vw,32px);display:block;margin-top:2px}
.hero .n{background:var(--navy);color:var(--rosa);padding:30px 28px;margin:-44px 0 0 12%;text-align:right}
.hero .n h1{font-size:clamp(30px,6vw,52px);text-transform:none;letter-spacing:.01em}
.hero .n span{display:block;color:var(--weiss);font-family:var(--title);font-weight:700;margin-top:6px}
.intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:8px 0 32px}
.intro div{border:2px solid var(--rosa);border-radius:14px;padding:14px 16px;color:var(--koralle)}
.intro b{display:block;color:var(--navy);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--navy);color:var(--weiss);border-radius:999px;padding:14px 34px;font-family:var(--title);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:16px;transition:transform .15s,background .15s}
.btn:hover{background:#2A3396}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--weiss);color:var(--navy);border:2px solid var(--navy)}
.center{text-align:center}

/* Frage */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.zaehler{font-family:var(--title);font-weight:700;color:var(--koralle);font-size:15px;letter-spacing:.05em}
.frage{font-size:clamp(20px,3.2vw,28px);font-weight:600;line-height:1.3;margin-bottom:22px}
.bild{background:var(--sand);border-radius:14px;padding:22px;display:flex;justify-content:center;margin-bottom:22px}
.bild svg{width:100%;max-width:380px;height:auto;max-height:240px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--rosa);border-radius:999px;padding:12px 22px 12px 12px;background:var(--weiss);font-size:17px;font-weight:600;transition:background .15s,border-color .15s,color .15s}
.opt .b{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--rosa);display:grid;place-items:center;font-family:var(--title);font-weight:700;font-size:15px;padding-top:2px}
.opt:hover:not([disabled]){background:var(--graublau);border-color:var(--graublau)}
.opt[disabled]{cursor:default}
.opt.richtig{background:var(--navy);border-color:var(--navy);color:var(--weiss)}
.opt.richtig .b{background:var(--weiss);color:var(--navy)}
.opt.falsch{background:var(--koralle);border-color:var(--koralle);color:var(--weiss)}
.opt.falsch .b{background:var(--weiss);color:var(--koralle)}
.opt.aus{opacity:.45}
.fb{margin-top:20px;border-radius:14px;padding:18px 20px;background:var(--sand);border-left:6px solid var(--navy);display:none}
.fb.show{display:block;animation:in .25s ease}
.fb.neg{border-left-color:var(--koralle)}
.fb h2{font-size:18px;margin-bottom:6px}
.fb.neg h2{color:var(--koralle)}
.weiter{margin-top:22px;text-align:right;display:none}
.weiter.show{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Resultat */
.res{background:var(--navy);color:var(--weiss);border-radius:0;padding:36px 28px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;margin-bottom:28px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--koralle) calc(var(--p)*1%),rgba(255,255,255,.15) 0)}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--navy);display:grid;place-items:center;text-align:center;font-family:var(--title);font-weight:700;font-size:34px;line-height:1}
.ring small{display:block;font-size:13px;color:var(--rosa);letter-spacing:.05em;margin-top:4px}
.res h1{color:var(--rosa);font-size:clamp(24px,4vw,36px);margin-bottom:8px}
.themen{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:28px}
.themen div{background:var(--graublau);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;font-weight:600;font-size:15px}
.themen div b{font-family:var(--title)}
.liste h2{font-size:20px;margin-bottom:12px}
.liste .it{border:2px solid var(--rosa);border-radius:14px;padding:14px 18px;margin-bottom:10px}
.liste .it p{font-weight:600}
.liste .it span{display:block;color:var(--koralle);font-size:15px;margin-top:4px}
.liste .it span b{color:var(--navy)}
.aktionen{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.hidden{display:none}

@media (max-width:560px){
  body{font-size:16px}
  .wrap{padding:18px 16px 36px}
  .top .pill{display:none}
  .hero .r{width:92%;padding:22px 20px 64px}
  .hero .n{margin-left:6%;padding:24px 20px}
  .opt{font-size:16px;padding:10px 16px 10px 10px}
  .res{grid-template-columns:1fr;justify-items:center;text-align:center}
  .weiter .btn{width:100%}
}
@media (min-width:1200px){
  body{font-size:19px}
  .wrap{max-width:980px}
  .opt{font-size:19px}
}

th=\"3.5\" fill=\"none\" stroke-linecap=\"butt\" stroke-linejoin=\"miter\"/>\n<path d=\"M1580,460L1460,540.0L1580,620\" stroke=\"#1B237A\" stroke-width=\"3.5\" fill=\"none\" stroke-linecap=\"butt\" stroke-linejoin=\"miter\"/>\n<path d=\"M1460,460h120v160h-120z\" stroke=\"#1B237A\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"butt\" stroke-linejoin=\"miter\"/>\n<text x=\"880\" y=\"551.9\" font-family=\"'Open Sans', Arial, sans-serif\" font-size=\"34\" font-weight=\"600\" fill=\"#1B237A\">Drehkippflügel, Band rechts</text>\n</svg>\n"};

const $ = id => document.getElementById(id);
const BUCHST = ["A","B","C","D"];
let runde = [], i = 0, punkte = 0, falsch = [];

function mischen(a){ a = a.slice(); for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];} return a; }
function zeige(id){ ["start","quiz","ende"].forEach(s => $(s).classList.toggle("hidden", s!==id)); window.scrollTo({top:0}); }

function starte(liste){
  runde = liste.map(f => ({...f, opts: mischen(f.a)}));
  i = 0; punkte = 0; falsch = [];
  zeige("quiz"); frage();
}

function frage(){
  const f = runde[i];
  $("thema").textContent = f.t;
  $("themaTop").textContent = f.t;
  $("zaehler").textContent = `${i+1} / ${runde.length}`;
  $("fort").style.width = (i / runde.length * 100) + "%";
  $("frage").textContent = f.q;
  const bild = $("bild");
  if (f.img){ bild.innerHTML = BILDER[f.img]; bild.classList.remove("hidden"); }
  else { bild.innerHTML = ""; bild.classList.add("hidden"); }
  const box = $("opts"); box.innerHTML = "";
  f.opts.forEach((o, k) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="b">${BUCHST[k]}</span><span></span>`;
    b.lastChild.textContent = o;
    b.onclick = () => antwort(b, o);
    box.appendChild(b);
  });
  $("fb").className = "fb"; $("weiter").className = "weiter";
}

function antwort(btn, o){
  const f = runde[i], ok = o === f.a[0];
  [...$("opts").children].forEach(b => {
    b.disabled = true;
    const txt = b.lastChild.textContent;
    if (txt === f.a[0]) b.classList.add("richtig");
    else if (b === btn) b.classList.add("falsch");
    else b.classList.add("aus");
  });
  if (ok) punkte++; else falsch.push(f);
  f.ok = ok;
  $("fbT").textContent = ok ? "Richtig!" : `Leider falsch. Richtig ist: ${f.a[0]}`;
  $("fbE").textContent = f.e;
  $("fb").className = "fb show" + (ok ? "" : " neg");
  $("next").textContent = i === runde.length - 1 ? "Zum Resultat" : "Weiter";
  $("weiter").className = "weiter show";
  $("fort").style.width = ((i+1) / runde.length * 100) + "%";
  $("next").focus({preventScroll:true});
  $("weiter").scrollIntoView({behavior:"smooth", block:"nearest"});
}

$("next").onclick = () => { i++; i < runde.length ? frage() : ende(); };

function ende(){
  const n = runde.length, p = Math.round(punkte / n * 100);
  $("ring").style.setProperty("--p", p);
  $("punkte").textContent = punkte;
  $("von").textContent = `VON ${n}`;
  $("themaTop").textContent = "Resultat";
  const [t, txt] = p >= 90 ? ["Ausgezeichnet!", "Du kennst den Stoff von Abend 1 sehr gut."]
    : p >= 70 ? ["Gut gemacht!", "Die Grundlagen sitzen. Schau dir die falschen Fragen unten nochmals an."]
    : p >= 50 ? ["Auf gutem Weg", "Einiges sitzt schon. Lies die markierten Themen im Skript nochmals nach."]
    : ["Dranbleiben!", "Nimm das Skript Kapitel 2 und 3 nochmals zur Hand und versuche es dann erneut."];
  $("lob").textContent = t; $("lobT").textContent = `${p}% richtig. ${txt}`;

  const th = {};
  runde.forEach(f => { th[f.t] = th[f.t] || [0,0]; th[f.t][1]++; if (f.ok) th[f.t][0]++; });
  $("themen").innerHTML = "";
  Object.entries(th).forEach(([k,[a,b]]) => {
    const d = document.createElement("div");
    d.innerHTML = `<span></span><b>${a}/${b}</b>`; d.firstChild.textContent = k;
    $("themen").appendChild(d);
  });

  const l = $("liste"); l.innerHTML = "";
  if (falsch.length){
    l.innerHTML = "<h2>Das nochmals anschauen</h2>";
    falsch.forEach(f => {
      const d = document.createElement("div"); d.className = "it";
      d.innerHTML = `<p></p><span>Richtig: <b></b></span>`;
      d.querySelector("p").textContent = f.q; d.querySelector("b").textContent = f.a[0];
      l.appendChild(d);
    });
  }
  $("fehler").classList.toggle("hidden", !falsch.length);
  zeige("ende");
}

$("anzahl").textContent = FRAGEN.length;
$("los").onclick = () => starte(FRAGEN);
$("nochmal").onclick = () => starte(FRAGEN);
$("fehler").onclick = () => starte(falsch.slice());
document.addEventListener("keydown", e => {
  if ($("quiz").classList.contains("hidden")) return;
  const k = "1234abcd".indexOf(e.key.toLowerCase());
  const btns = $("opts").children;
  if (k > -1 && btns[k % 4] && !btns[k % 4].disabled) btns[k % 4].click();
});
</script>
